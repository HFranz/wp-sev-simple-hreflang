<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Page background -->
  <rect x="0" y="0" width="1280" height="800" fill="#f0f0f1" />

  <!-- Top admin bar -->
  <rect x="0" y="0" width="1280" height="32" fill="#1d2327" />
  <text x="16" y="21" fill="#c3c4c7" font-size="13">WordPress</text>
  <text x="1180" y="21" fill="#c3c4c7" font-size="13">Update, Save draft, Preview</text>

  <!-- Editor top toolbar -->
  <rect x="0" y="32" width="1280" height="60" fill="#ffffff" />
  <line x1="0" y1="92" x2="1280" y2="92" stroke="#e0e0e0" stroke-width="1" />
  <circle cx="34" cy="62" r="14" fill="#f0f0f1" stroke="#757575" stroke-width="1.5" />
  <text x="30" y="67" fill="#1e1e1e" font-size="16">+</text>
  <rect x="70" y="50" width="26" height="26" rx="3" fill="#f0f0f1" />
  <rect x="104" y="50" width="26" height="26" rx="3" fill="#f0f0f1" />
  <text x="300" y="67" fill="#1e1e1e" font-size="14" text-anchor="middle">Beispielseite</text>
  <rect x="980" y="50" width="90" height="26" rx="3" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.2" />
  <text x="1025" y="67" fill="#1e1e1e" font-size="12" text-anchor="middle">Vorschau</text>
  <rect x="1082" y="50" width="80" height="26" rx="3" fill="#1e1e1e" />
  <text x="1122" y="67" fill="#ffffff" font-size="12" text-anchor="middle">Veröffentl.</text>
  <rect x="1174" y="50" width="26" height="26" rx="3" fill="#f0f0f1" />
  <text x="1187" y="68" fill="#1e1e1e" font-size="14" text-anchor="middle">☰</text>

  <!-- Editor canvas (left) -->
  <rect x="0" y="92" width="928" height="708" fill="#f0f0f1" />
  <rect x="120" y="150" width="688" height="560" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
  <text x="160" y="220" fill="#1e1e1e" font-size="32" font-weight="600">Beispielseite</text>
  <rect x="160" y="260" width="608" height="14" rx="2" fill="#e0e0e0" />
  <rect x="160" y="286" width="560" height="14" rx="2" fill="#e0e0e0" />
  <rect x="160" y="312" width="590" height="14" rx="2" fill="#e0e0e0" />
  <rect x="160" y="338" width="420" height="14" rx="2" fill="#e0e0e0" />

  <!-- Sidebar (right) -->
  <rect x="928" y="92" width="352" height="708" fill="#ffffff" />
  <line x1="928" y1="92" x2="928" y2="800" stroke="#e0e0e0" stroke-width="1" />

  <!-- Sidebar tabs -->
  <text x="978" y="122" fill="#1e1e1e" font-size="13" font-weight="600" text-anchor="middle">Seite</text>
  <line x1="948" y1="136" x2="1008" y2="136" stroke="#1e1e1e" stroke-width="2" />
  <text x="1080" y="122" fill="#757575" font-size="13" text-anchor="middle">Block</text>
  <line x1="928" y1="148" x2="1280" y2="148" stroke="#e0e0e0" stroke-width="1" />

  <!-- Standard panels (collapsed, for realism) -->
  <text x="948" y="180" fill="#1e1e1e" font-size="13">Zusammenfassung</text>
  <text x="1256" y="180" fill="#757575" font-size="13" text-anchor="end">⌄</text>
  <line x1="928" y1="196" x2="1280" y2="196" stroke="#e0e0e0" stroke-width="1" />

  <!-- hreflang panel (expanded) -->
  <text x="948" y="228" fill="#1e1e1e" font-size="13" font-weight="600">hreflang (alternative Sprachversionen)</text>
  <text x="1256" y="228" fill="#757575" font-size="13" text-anchor="end">⌃</text>

  <!-- Row 1 -->
  <text x="948" y="260" fill="#757575" font-size="11">hreflang</text>
  <rect x="948" y="266" width="308" height="32" rx="3" fill="#ffffff" stroke="#949494" stroke-width="1" />
  <text x="958" y="287" fill="#1e1e1e" font-size="13">en-US</text>

  <text x="948" y="316" fill="#757575" font-size="11">URL</text>
  <rect x="948" y="322" width="308" height="32" rx="3" fill="#ffffff" stroke="#949494" stroke-width="1" />
  <text x="958" y="343" fill="#1e1e1e" font-size="13">https://example.com/en/page/</text>

  <text x="948" y="372" fill="#2271b1" font-size="12">Zeile entfernen</text>
  <line x1="928" y1="386" x2="1280" y2="386" stroke="#f0f0f1" stroke-width="1" />

  <!-- Row 2 -->
  <text x="948" y="412" fill="#757575" font-size="11">hreflang</text>
  <rect x="948" y="418" width="308" height="32" rx="3" fill="#ffffff" stroke="#949494" stroke-width="1" />
  <text x="958" y="439" fill="#1e1e1e" font-size="13">fr-FR</text>

  <text x="948" y="468" fill="#757575" font-size="11">URL</text>
  <rect x="948" y="474" width="308" height="32" rx="3" fill="#ffffff" stroke="#949494" stroke-width="1" />
  <text x="958" y="495" fill="#1e1e1e" font-size="13">https://example.com/fr/page/</text>

  <text x="948" y="524" fill="#2271b1" font-size="12">Zeile entfernen</text>
  <line x1="928" y1="540" x2="1280" y2="540" stroke="#f0f0f1" stroke-width="1" />

  <!-- Add row button -->
  <rect x="948" y="558" width="200" height="32" rx="3" fill="#f0f0f1" stroke="#1e1e1e" stroke-width="1" />
  <text x="1048" y="579" fill="#1e1e1e" font-size="12" text-anchor="middle">Sprachversion hinzufügen</text>

  <!-- Caption -->
  <text x="640" y="778" fill="#757575" font-size="12" text-anchor="middle" font-style="italic">
    Mockup only — not an actual screenshot. Replace with a real capture before wp.org submission.
  </text>
</svg>
